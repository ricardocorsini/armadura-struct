name: Validate and build
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-update-evidence
          if-no-files-found: ignore
          path: docs/updates-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drawing-metadata-evidence
          if-no-files-found: ignore
          path: docs/drawing-metadata-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stirrup-launch-evidence
          if-no-files-found: ignore
          path: docs/stirrup-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contextual-tree-evidence
          if-no-files-found: ignore
          path: docs/contextual-tree-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-folder-evidence
          if-no-files-found: ignore
          path: docs/project-folder-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mask-dimensions-evidence
          if-no-files-found: ignore
          path: docs/mask-dimensions-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mask-contour-evidence
          if-no-files-found: ignore
          path: docs/mask-contour-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mask-mirror-evidence
          if-no-files-found: ignore
          path: docs/mask-mirror-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphic-properties-evidence
          if-no-files-found: ignore
          path: docs/match-properties-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mask-offset-evidence
          if-no-files-found: ignore
          path: docs/mask-offset-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mask-manipulation-evidence
          if-no-files-found: ignore
          path: |
            docs/mask-erase-*.png
            docs/mask-copy-*.png
            docs/mask-manip-*.png
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
            artifact: linux-x64
          - os: windows-latest
            bundles: nsis
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path crates/openstruct-distribution/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml project_folder::tests
      - run: npm run desktop:build -- --bundles ${{ matrix.bundles }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Native update adapter in isolated installation
        run: node scripts/test-native-update-adapter.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ArmaduraStruct-${{ github.sha }}-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
