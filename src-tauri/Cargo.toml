[package]
name = "armadurastruct"
version = "0.5.0"
description = "Editor CAD de armaduras - OpenStruct"
authors = ["Ricardo Corsini", "OpenStruct contributors"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "armadurastruct_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openstruct-distribution = { path = "../crates/openstruct-distribution" }
anyhow = "1"
cap-std = "3"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
